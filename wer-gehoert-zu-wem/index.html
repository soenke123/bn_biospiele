<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="../vendor/tailwind.js"></script>
    <!-- Font Awesome (lokal, nur fa-solid) -->
    <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
    <style>
        /* Touch: kein Doppeltipp-Zoom, kein graues Tap-Highlight, kein Long-Press-Menü */
        html, body, button {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
            min-height: 100vh;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }

        .card-glow {
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card-hover:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .card-selected {
            transform: translateY(-8px) scale(1.04);
            box-shadow: 0 0 25px rgba(45, 212, 191, 0.6);
        }

        .card-matched {
            animation: matchPulse 0.6s ease-out forwards;
        }

        .card-error {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes matchPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); box-shadow: 0 0 30px rgba(52, 211, 153, 0.8); }
            100% { transform: scale(1); opacity: 0.85; filter: grayscale(0.2); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #0d9488;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #14b8a6;
        }
    </style>
</head>

                            <path d="M86 58 l1 2.5 l2.5 1 l-2.5 1 l-1 2.5 l-1 -2.5 l-2.5 -1 l2.5 -1 Z"/>
                        </g>
                    `)
                }
            }
        ];

        // State Variables
        let cards = [];
        let selectedCards = [];
        let matchedPairIds = [];
        let attempts = 0;
        let timerSeconds = 0;
        let timerInterval = null;
        let isTimerRunning = false;

        // Web Audio API Sound Generator
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(160, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'victory') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + idx * 0.12);
                    g.gain.setValueAtTime(0.2, now + idx * 0.12);
                    g.gain.linearRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
                    o.start(now + idx * 0.12);
                    o.stop(now + idx * 0.12 + 0.3);
                });
            }
        }

        // DOM Elements
        const grid = document.getElementById('cards-grid');
        const pairsCountEl = document.getElementById('pairs-count');
        const attemptsCountEl = document.getElementById('attempts-count');
        const timerEl = document.getElementById('timer');
        const progressBar = document.getElementById('progress-bar');
        const resetBtn = document.getElementById('reset-btn');

        // Modals
        const infoModal = document.getElementById('info-modal');
        const modalContent = document.getElementById('modal-content');
        const modalBadge = document.getElementById('modal-badge');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-description');
        const modalImg1 = document.getElementById('modal-img-1');
        const modalImg2 = document.getElementById('modal-img-2');
        const modalName1 = document.getElementById('modal-name-1');
        const modalName2 = document.getElementById('modal-name-2');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        const victoryModal = document.getElementById('victory-modal');
        const finalTimeEl = document.getElementById('final-time');
        const finalAttemptsEl = document.getElementById('final-attempts');
        const summaryListEl = document.getElementById('summary-list');
        const restartGameBtn = document.getElementById('restart-game-btn');

        // Shuffle utility
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Timer functions
        function startTimer() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                    const secs = String(timerSeconds % 60).padStart(2, '0');
                    timerEl.textContent = `${mins}:${secs}`;
                }, 1000);
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
        }

        function resetTimer() {
            stopTimer();
            timerSeconds = 0;
            timerEl.textContent = '00:00';
        }

        // Flatten 7 pairs into 14 cards
        function initGame() {
            stopTimer();
            resetTimer();

            matchedPairIds = [];
            selectedCards = [];
            attempts = 0;

            attemptsCountEl.textContent = '0';
            pairsCountEl.textContent = `0 / ${matchPairs.length}`;
            progressBar.style.width = '0%';

            let deck = [];
            matchPairs.forEach(pair => {
                deck.push({
                    cardUniqueId: pair.id + '_1',
                    pairId: pair.id,
                    name: pair.item1.name,
                    icon: pair.item1.icon,
                    pairData: pair
                });
                deck.push({
                    cardUniqueId: pair.id + '_2',
                    pairId: pair.id,
                    name: pair.item2.name,
                    icon: pair.item2.icon,
                    pairData: pair
                });
            });

            cards = shuffle(deck);
            renderBoard();
        }

        // Render Grid
        function renderBoard() {
            grid.innerHTML = '';
            cards.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.dataset.uniqueId = card.cardUniqueId;
                cardEl.dataset.pairId = card.pairId;
                
                cardEl.className = `card-hover card-glow bg-slate-900/90 border-2 border-slate-700/70 hover:border-teal-400/60 rounded-2xl p-3 flex flex-col items-center justify-between cursor-pointer aspect-square sm:aspect-auto sm:h-44 relative overflow-hidden group select-none`;

                cardEl.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-b from-teal-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    
                    <!-- Icon Box -->
                    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl bg-slate-950/60 p-1 flex items-center justify-center border border-slate-800 group-hover:border-teal-500/40 transition-colors shadow-inner mt-1">
                        ${card.icon}
                    </div>

                    <!-- Label -->
                    <div class="text-center w-full z-10 my-2">
                        <span class="block text-xs sm:text-sm font-bold text-slate-100 group-hover:text-teal-300 transition-colors truncate px-1">
                            ${card.name}
                        </span>
                    </div>

                    <!-- Indicator -->
                    <div class="absolute top-2 right-2 w-2 h-2 rounded-full bg-slate-700 indicator-dot"></div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(card, cardEl));
                grid.appendChild(cardEl);
            });
        }

        function handleCardClick(card, cardEl) {
            startTimer();

            if (matchedPairIds.includes(card.pairId) || selectedCards.some(c => c.cardUniqueId === card.cardUniqueId)) {
                return;
            }

            playSound('select');
            selectedCards.push({ card, el: cardEl });
            
            cardEl.classList.add('card-selected', 'border-teal-400');
            cardEl.querySelector('.indicator-dot').classList.replace('bg-slate-700', 'bg-teal-400');

            if (selectedCards.length === 2) {
                attempts++;
                attemptsCountEl.textContent = attempts;

                const [first, second] = selectedCards;

                if (first.card.pairId === second.card.pairId) {
                    handleMatch(first, second);
                } else {
                    handleMismatch(first, second);
                }

                selectedCards = [];
            }
        }

        function handleMatch(first, second) {
            playSound('match');
            const pairId = first.card.pairId;
            matchedPairIds.push(pairId);

            [first.el, second.el].forEach(el => {
                el.classList.remove('card-selected', 'border-teal-400', 'card-hover');
                el.classList.add('card-matched', 'border-emerald-500', 'bg-emerald-950/20');
                const dot = el.querySelector('.indicator-dot');
                dot.classList.replace('bg-teal-400', 'bg-emerald-400');
                dot.classList.add('shadow-lg', 'shadow-emerald-400');
            });

            const progress = (matchedPairIds.length / matchPairs.length) * 100;
            pairsCountEl.textContent = `${matchedPairIds.length} / ${matchPairs.length}`;
            progressBar.style.width = `${progress}%`;

            setTimeout(() => {
                showInfoModal(first.card.pairData);
            }, 400);
        }

        function handleMismatch(first, second) {
            playSound('error');
            [first.el, second.el].forEach(el => {
                el.classList.add('card-error', 'border-rose-500');
            });

            setTimeout(() => {
                [first.el, second.el].forEach(el => {
                    el.classList.remove('card-selected', 'card-error', 'border-teal-400', 'border-rose-500');
                    el.querySelector('.indicator-dot').classList.replace('bg-teal-400', 'bg-slate-700');
                });
            }, 600);
        }

        function showInfoModal(pairData) {
            modalBadge.textContent = pairData.type;
            modalTitle.textContent = pairData.title;
            modalDesc.textContent = pairData.description;

            modalImg1.innerHTML = pairData.item1.icon;
            modalImg2.innerHTML = pairData.item2.icon;

            modalName1.textContent = pairData.item1.name;
            modalName2.textContent = pairData.item2.name;

            infoModal.classList.remove('hidden');
            setTimeout(() => {
                infoModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function hideInfoModal() {
            infoModal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            setTimeout(() => {
                infoModal.classList.add('hidden');
                if (matchedPairIds.length === matchPairs.length) {
                    showVictoryModal();
                }
            }, 300);
        }

        function showVictoryModal() {
            clearInterval(timerInterval);
            playSound('victory');

            finalTimeEl.textContent = timerEl.textContent;
            finalAttemptsEl.textContent = attempts;

            summaryListEl.innerHTML = '';
            matchPairs.forEach(pair => {
                const item = document.createElement('div');
                item.className = 'p-2.5 rounded-xl bg-slate-900 border border-slate-800 flex items-start gap-3';
                item.innerHTML = `
                    <div class="w-8 h-8 rounded-lg bg-teal-500/20 text-teal-300 flex items-center justify-center flex-shrink-0 border border-teal-500/30 font-bold text-xs">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-200">${pair.item1.name} & ${pair.item2.name}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-teal-400 font-semibold border border-slate-700">${pair.type}</span>
                        </div>
                        <p class="text-[11px] text-slate-400 mt-0.5 leading-snug">${pair.description}</p>
                    </div>
                `;
                summaryListEl.appendChild(item);
            });

            victoryModal.classList.remove('hidden');
            setTimeout(() => {
                victoryModal.classList.remove('opacity-0');
            }, 10);
        }

        modalCloseBtn.addEventListener('click', hideInfoModal);
        resetBtn.addEventListener('click', initGame);
        restartGameBtn.addEventListener('click', () => {
            victoryModal.classList.add('opacity-0');
            setTimeout(() => {
                victoryModal.classList.add('hidden');
                initGame();
            }, 300);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !infoModal.classList.contains('hidden')) {
                hideInfoModal();
            }
        });

        window.onload = initGame;
    </script>
</body>
</html>
